<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logout-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .logout-message {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .logout-status {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            text-align: left;
        }

        .logout-status p {
            color: #333;
            font-size: 14px;
            margin: 5px 0;
        }

        .logout-status .status-label {
            font-weight: 600;
            color: #667eea;
        }

        .countdown {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .footer-text {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }

        .spinner {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #667eea;
            animation: pulse 1s infinite;
            margin-right: 5px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logout-icon">👋</div>
        <h1>You've Been Logged Out</h1>
        <p class="logout-message">Your session has ended securely. All your session data has been cleared.</p>

        <div class="logout-status">
            <p><span class="status-label">Status:</span> Successfully logged out</p>
            <p><span class="status-label">Timestamp:</span> <span id="logout-time"></span></p>
            <p><span class="status-label">Session:</span> Terminated</p>
        </div>

        <div class="countdown">Redirecting in <span id="countdown">5</span> seconds...</div>

        <div class="button-group">
            <button class="btn-primary" onclick="loginRedirect()">Login Again</button>
            <button class="btn-secondary" onclick="homeRedirect()">Go Home</button>
        </div>

        <p class="footer-text">If you didn't log out, please contact support.</p>
    </div>

    <script>
        // Set logout timestamp
        function setLogoutTime() {
            const now = new Date();
            const timeString = now.toLocaleString();
            document.getElementById('logout-time').textContent = timeString;
        }

        // Countdown timer
        function startCountdown() {
            let count = 5;
            const countdownElement = document.getElementById('countdown');

            const interval = setInterval(() => {
                count--;
                countdownElement.textContent = count;

                if (count <= 0) {
                    clearInterval(interval);
                    homeRedirect();
                }
            }, 1000);
        }

        // Redirect to login
        function loginRedirect() {
            // Replace with your actual login page URL
            window.location.href = '/login.html';
        }

        // Redirect to home
        function homeRedirect() {
            // Replace with your actual home page URL
            window.location.href = '/index.html';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            setLogoutTime();
            startCountdown();
        });
    </script>
</body>
</html>
