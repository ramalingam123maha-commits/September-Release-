<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login - HTML Based</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper" id="loginWrapper">
            <!-- Login Form -->
            <div class="form-container login-form" id="loginForm">
                <div class="form-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account</p>
                </div>

                <form id="loginFormElement" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                        >
                        <span class="error-message" id="loginEmailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="loginPassword" 
                                name="password" 
                                placeholder="Enter your password" 
                                required
                            >
                            <button 
                                type="button" 
                                class="toggle-password" 
                                onclick="togglePasswordVisibility('loginPassword')"
                            >
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="loginPasswordError"></span>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign In</button>

                    <div class="success-message" id="loginSuccess"></div>
                    <div class="error-message" id="loginError"></div>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? 
                        <a href="#" onclick="switchToRegister(event)">Create one</a>
                    </p>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-container register-form" id="registerForm" style="display: none;">
                <div class="form-header">
                    <h1>Create Account</h1>
                    <p>Join us today</p>
                </div>

                <form id="registerFormElement" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="registerUsername">Username</label>
                        <input 
                            type="text" 
                            id="registerUsername" 
                            name="username" 
                            placeholder="Choose a username" 
                            required
                            minlength="3"
                        >
                        <span class="error-message" id="usernameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="registerEmail" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                        >
                        <span class="error-message" id="registerEmailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="registerPassword" 
                                name="password" 
                                placeholder="Create a password" 
                                required
                                minlength="6"
                            >
                            <button 
                                type="button" 
                                class="toggle-password" 
                                onclick="togglePasswordVisibility('registerPassword')"
                            >
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="registerPasswordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="registerConfirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="registerConfirmPassword" 
                                name="confirmPassword" 
                                placeholder="Confirm your password" 
                                required
                            >
                            <button 
                                type="button" 
                                class="toggle-password" 
                                onclick="togglePasswordVisibility('registerConfirmPassword')"
                            >
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>

                    <div class="form-options">
                        <label class="terms-agreement">
                            <input type="checkbox" name="terms" id="agreeTerms" required>
                            <span>I agree to the <a href="#">Terms and Conditions</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Account</button>

                    <div class="success-message" id="registerSuccess"></div>
                    <div class="error-message" id="registerError"></div>
                </form>

                <div class="form-footer">
                    <p>Already have an account? 
                        <a href="#" onclick="switchToLogin(event)">Sign in</a>
                    </p>
                </div>
            </div>

            <!-- User Dashboard (shown after login) -->
            <div class="dashboard" id="dashboard" style="display: none;">
                <div class="dashboard-header">
                    <h1>Dashboard</h1>
                    <button class="btn btn-secondary" onclick="handleLogout()">Logout</button>
                </div>

                <div class="user-info">
                    <div class="user-card">
                        <div class="user-avatar">
                            <span id="userInitial">U</span>
                        </div>
                        <div class="user-details">
                            <h2 id="dashboardUsername">User</h2>
                            <p id="dashboardEmail">user@example.com</p>
                            <p class="login-time">Logged in at: <span id="loginTime"></span></p>
                        </div>
                    </div>
                </div>

                <div class="user-stats">
                    <div class="stat-card">
                        <span class="stat-label">Account Status</span>
                        <span class="stat-value">Active</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Login Count</span>
                        <span class="stat-value" id="loginCount">1</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Last Login</span>
                        <span class="stat-value" id="lastLoginTime">Today</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
