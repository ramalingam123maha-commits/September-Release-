<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management Dashboard</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#222}header{background:#1e3a8a;color:#fff;padding:1rem 2rem}main{padding:1rem 2rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}section{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 1px 3px #0002}h2{margin-top:0;font-size:1.1rem}input,select,button{padding:.4rem;margin:.2rem 0}button{background:#1e3a8a;color:#fff;border:0;border-radius:4px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.3rem;border-bottom:1px solid #eee}#msg{color:#b91c1c;min-height:1.2em}</style></head><body>
<header><h1>Student Management Dashboard</h1></header><div style="padding:0 2rem" id="msg" role="alert"></div>
<main>
<section><h2>Register student</h2><form id="sf"><input name="name" placeholder="Name" required aria-label="Name"> <input name="email" type="email" placeholder="Email" required aria-label="Email"> <button>Add</button></form><table id="st"></table></section>
<section><h2>Courses</h2><form id="cf"><input name="code" placeholder="Code" required aria-label="Code"> <input name="title" placeholder="Title" required aria-label="Title"> <input name="capacity" type="number" min="1" placeholder="Capacity" aria-label="Capacity"> <button>Add</button></form><table id="ct"></table></section>
<section><h2>Enroll</h2><form id="ef"><select name="studentId" id="es" aria-label="Student"></select> <select name="courseId" id="ec" aria-label="Course"></select> <button>Enroll</button></form>
<h2>Record grade</h2><form id="gf"><select name="studentId" id="gs" aria-label="Student"></select> <select name="courseId" id="gc" aria-label="Course"></select> <input name="score" type="number" min="0" max="100" required placeholder="Score" aria-label="Score"> <button>Save</button></form></section>
<section><h2>Performance report</h2><div id="rp"></div><a href="/api/reports/performance.csv">Download CSV</a></section>
</main><script src="app.js"></script></body></html>
